name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Architecture, types and tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packaging/runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check reproducible source snapshot
        run: npm run verify:source-snapshot

      - name: Check architecture
        run: npm run check:architecture

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit Runtime independence
        run: npm run audit:runtime-independence

      - name: Verify release contract
        run: npm run verify:release-contract
